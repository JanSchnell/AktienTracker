<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aktien-Tracker</title>
  <meta name="description" content="Watchlist-Analyse: Rückgang vom Allzeithoch, Kaufstufen, Quartalszahlen, Insider- und Investoren-Bewegungen">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aktien">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#/">
        <img src="icon.svg" alt="" width="28" height="28">
        <span>Aktien-Tracker</span>
      </a>
      <nav class="tabs" id="tabs">
        <a href="#/" data-tab="uebersicht">Übersicht</a>
        <a href="#/entdecken" data-tab="entdecken">Entdecken</a>
        <a href="#/investoren" data-tab="investoren">Investoren</a>
        <div class="mehr">
          <button type="button" id="mehrBtn" aria-haspopup="true" aria-expanded="false">Mehr ▾</button>
          <div class="mehr-menu" id="mehrMenu" hidden>
            <a href="#/alarme" data-tab="alarme">Preisalarme</a>
            <a href="#/vergleich" data-tab="vergleich">Aktien vergleichen</a>
            <a href="#/lexikon" data-tab="lexikon">Lexikon</a>
            <a href="#/regeln" data-tab="regeln">Kaufregeln & Beträge</a>
          </div>
        </div>
        <button type="button" id="suchBtn" aria-label="Unternehmen suchen" title="Unternehmen suchen">🔍</button>
      </nav>
    </div>
    <div class="such-panel" id="suchPanel" hidden>
      <div class="wrap"><input type="search" id="suchFeld" placeholder="Unternehmen, Ticker oder Branche suchen …" aria-label="Suche"><div class="such-liste" id="suchListe"></div></div>
    </div>
  </header>

  <main class="wrap" id="app">
    <p class="muted">Lade Daten …</p>
  </main>

  <footer class="wrap foot muted">
    <span id="stand"></span>
    <span>Daten: Yahoo Finance, SEC EDGAR. Keine Anlageberatung, alle Angaben ohne Gewähr.</span>
  </footer>

  <script src="lexikon.js"></script>
  <script src="werkzeuge.js"></script>
  <script src="app.js"></script>
</body>
</html>
