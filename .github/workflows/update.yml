name: Daten aktualisieren

on:
  schedule:
    # Zeiten in UTC (Winterzeit: +1 h, Sommerzeit: +2 h deutsche Zeit), Montag bis Freitag
    - cron: "30 6 * * 1-5"    # vor Xetra-Eröffnung
    - cron: "30 11 * * 1-5"   # Mittag Europa
    - cron: "0 15 * * 1-5"    # kurz nach US-Eröffnung
    - cron: "30 21 * * 1-5"   # nach US-Börsenschluss
    - cron: "0 16 * * 0"      # Sonntag: Telegram-Wochenbericht
  workflow_dispatch:           # manuell starten über den Actions-Tab
    inputs:
      wochenbericht:
        description: "Wochenbericht jetzt testweise per Telegram senden"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["config/**", "docs/**", "scripts/**"]
  issues:
    types: [opened]            # „Watchlist: …“-Issues von der Webseite

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # Issues nur vom Repository-Besitzer und nur mit passendem Titel verarbeiten
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, 'Watchlist') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watchlist-Änderung aus Issue übernehmen
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NR: ${{ github.event.issue.number }}
        run: |
          python scripts/watchlist_issue.py || true
          gh issue comment "$ISSUE_NR" --body-file issue_result.md
          gh issue close "$ISSUE_NR"
          rm -f issue_result.md

      - name: Kurse, Kennzahlen und Filings laden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WOCHENBERICHT: ${{ inputs.wochenbericht }}
        run: python scripts/update.py

      - name: Watchlist und Alarm-Zustand speichern
        run: |
          git config user.name "aktien-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json config/watchlist.json
          git diff --cached --quiet || git commit -m "Zustand/Watchlist aktualisiert"
          git pull --rebase -q || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
